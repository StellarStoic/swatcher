name: Bug report
description: Report a reproducible s/watcher problem without sensitive wallet data
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never post seed phrases, private keys, xpubs, descriptors, addresses, Telegram tokens, Nostr nsecs, onion URLs, or server logs containing them. Use private vulnerability reporting for security issues.
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Copy the version from the StartOS service page.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use redacted or synthetic Bitcoin and notification data.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove all wallet identifiers, credentials, addresses, and private hostnames before pasting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all wallet data, credentials, private keys, seed phrases, and private server addresses.
          required: true
