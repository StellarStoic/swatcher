version: 2
updates:
  # npm is deliberately absent: the fleet's update monitor owns the SDK and
  # npm bumps for every package, and a second bot collides with it.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
